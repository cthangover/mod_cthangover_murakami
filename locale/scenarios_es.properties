meeting_murakami/growl = [De la oscuridad llegó un gruñido sordo]
meeting_murakami/opt_home = Volver a casa
meeting_murakami/opt_alley = Revisar el callejón
meeting_murakami/wolf_appear = [Un lobo hambriento, que había entrado en la ciudad en busca de presa, enseñó los colmillos cerrando el paso]
meeting_murakami/marao_scared = - Oh, mierda...
meeting_murakami/battle_inevitable = [No quedaba duda: la pelea era inevitable]
meeting_murakami/after_wolf/tracks = [El lobo iba claramente a por esta casa: las huellas llevaban directas al umbral]
meeting_murakami/after_wolf/inspect = [Marao decidió inspeccionar la vivienda]
meeting_murakami/after_wolf/opt_approach = Acercarse a la puerta
meeting_murakami/after_wolf/greeting = - ¡Bella dama!
meeting_murakami/after_wolf/alone = - ¿Qué hace aquí tan sola?
meeting_murakami/after_wolf/dot1 = .
meeting_murakami/after_wolf/dot2 = ..
meeting_murakami/after_wolf/dot3 = ...
meeting_murakami/after_wolf/help = - Ayúdeme...
meeting_murakami/after_wolf/inside = - Está ahí... dentro...
meeting_murakami/after_wolf/fear = [La chica tiembla de miedo]
meeting_murakami/after_wolf/opt_enter = Entrar
meeting_murakami/after_wolf/enter = [Marao, sin dudarlo, cruzó el umbral]
meeting_murakami/after_wolf/look_around = - Vaya, vaya...
meeting_murakami/after_wolf/scream = - ¡¿AAH?!
meeting_murakami/after_wolf/why = - ¿Por qué vas...
meeting_murakami/after_wolf/explain = - Bella dama, es una larga historia. Aguante un poco, tengo que comprobar algo aquí.
meeting_murakami/after_wolf/hmm = - Hmm...
meeting_murakami/after_wolf/atmosphere = - Qué ambiente más asqueroso hay aquí... — [olfateó] — <s>el culo...</s>, ejem, mi instinto me dice que algo no va bien...
meeting_murakami/after_wolf/they_inside = - Están en esa habitación...
meeting_murakami/after_wolf/opt_enter_room = Entrar en la habitación
meeting_murakami/after_wolf/werewolf_gaze = [Marao se quedó helado, sorprendido por el brillo sangriento de unos ojos de licántropo.]
meeting_murakami/after_wolf/inevitable = [En aquel instante, la inevitabilidad misma se cernía sobre él.]
meeting_murakami/after_wolf/oh_shit = - Joder... — fue lo único que alcanzó a soltar.
meeting_murakami/after_boss/whew = - Uf... — Marao limpió su hoja. — Menudo bicho...
meeting_murakami/after_boss/dot1 = .
meeting_murakami/after_boss/dot2 = ..
meeting_murakami/after_boss/dot3 = ...
meeting_murakami/after_boss/you_killed = - Tú... ¿has matado a ese monstruo?
meeting_murakami/after_boss/yep = - Sí. Ya no molestará a nadie.
meeting_murakami/after_boss/silence = [Marao guardó silencio, observando a la chica.]
meeting_murakami/after_boss/come_with_me = - Está bien. — [suspiró.] — Ven conmigo. Te llevaré a un sitio seguro.
meeting_murakami/after_boss/outside = [Salieron fuera. La ciudad los recibió con silencio y olor a ceniza.]
meeting_murakami/end/arrived = - Ya hemos llegado.
meeting_murakami/end/door_open = [Marao empujó la puerta con el hombro y la dejó pasar primero. Las bisagras chirriaron lastimeras: hacía mucho que nadie abría esa puerta.]
meeting_murakami/end/make_yourself = - Esto es... — [miró el umbral.] — Bueno, se le puede llamar así. Ponte cómoda.
meeting_murakami/end/step_in = [Ella cruzó el umbral. Sus botas tocaron el suelo con cautela, como si no creyera que allí se pudiera caminar de verdad.]
meeting_murakami/end/dust = [El aire era pesado, olía a polvo y a algo viejo. Por las rendijas de las paredes entraban estrechas franjas de luz que arrancaban de la oscuridad motas de polvo solitarias.]
meeting_murakami/end/silence = [Silencio. En algún lugar de arriba crujió una tabla: la vieja casa despertaba poco a poco y aceptaba a una nueva inquilina.]
meeting_murakami/end/cozy = - Qué acogedor... — [en voz baja, casi para sí misma.]
meeting_murakami/end/supplies = [Marao miró de reojo la escuálida bolsa de provisiones colgada en la pared. Parecía que ahora iba a tener que deslomarse aún más para conseguir comida.]
meeting_murakami/end/your_home = - Bueno, — [murmuró, apartando la mirada.] — Ahora esta también es tu casa.
